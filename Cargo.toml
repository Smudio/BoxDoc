[package]
name = "boxdoc"
version = "0.7.0"
edition = "2021"
description = "Ein simples, leistungsstarkes und zuverlässiges Dokumenten-Programm"
license = "MIT OR Apache-2.0"

[lib]
name = "boxdoc"
path = "src/lib.rs"

[[bin]]
name = "boxdoc"
path = "src/main.rs"

[[bin]]
name = "gen_test_pdfs"
path = "src/bin/gen_test_pdfs.rs"
required-features = ["pdf-tools"]

[[bin]]
name = "test_pdf_import"
path = "src/bin/test_pdf_import.rs"
required-features = ["pdf-tools"]

[[bin]]
name = "test_pdf_roundtrip"
path = "src/bin/test_pdf_roundtrip.rs"
required-features = ["pdf-tools"]

[[bin]]
name = "test_pdf_export"
path = "src/bin/test_pdf_export.rs"
required-features = ["pdf-tools"]

[dependencies]
eframe = { version = "0.34", default-features = false, features = ["glow"] }
egui = "0.34"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp", "ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# PDF-Export und ODT laufen auf beiden Plattformen — auf Native in eine Datei,
# im Browser als Download. Beide Crates sind reines Rust; printpdf braucht dazu
# den wasm-Patch aus `vendor/printpdf` (siehe `[patch.crates-io]` unten).
printpdf = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Native-only Dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.34", default-features = false, features = ["glow", "wayland", "x11"] }
rfd = "0.15"
notify = "6"
notify-debouncer-mini = "0.4"
crossbeam-channel = "0.5"
# PDF-Import: high-level Pdfium-Binding. `pdfium-bundled` lädt die native
# pdfium-Bibliothek automatisch beim Build (gecacht im Target-Verzeichnis),
# sodass keine separate DLL-Auslieferung nötig ist.
pdfium-render = "0.9"
pdfium-bundled = "0.1"

# Nur für Tests: echter XML-Parser. Der SVG-Export prüft damit, dass die
# erzeugte Datei wirklich wohlgeformt ist — selbst gezählte Tags übersehen
# genau die Fälle, die in der Praxis brechen (Anführungszeichen in
# Attributen, base64-Blöcke, Unicode).
[dev-dependencies]
quick-xml = "0.36"

[features]
default = []
# Aktiviert die Build-Tools (z. B. gen_test_pdfs) zum Erzeugen von Test-PDFs.
pdf-tools = []

# Web-only Dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { version = "0.34", default-features = false, features = ["glow", "default_fonts"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlAnchorElement", "HtmlScriptElement",
    "Blob", "Url", "FileReader", "File", "FileList", "HtmlInputElement",
    "ClipboardEvent", "DataTransfer", "DataTransferItem",
    # Web-Sync (Backend)
    "Location", "History", "Request", "RequestInit", "RequestMode", "Response", "Headers",
    "Navigator",
] }
js-sys = "0.3"

# printpdf 0.7.0 lässt sich unverändert nicht für wasm32 bauen: sein eigener
# Datums-Polyfill ist unvollständig (`offset()` fehlt, `month()` gibt `u32`
# statt `u8`). `vendor/printpdf` ist eine Kopie mit genau diesen zwei
# Korrekturen — beide in `cfg(target_arch = "wasm32")`-Blöcken, der native
# Codepfad ist unverändert. Begründung und Upgrade-Pfad:
# `vendor/printpdf/BOXDOC-PATCH.md`.
[patch.crates-io]
printpdf = { path = "vendor/printpdf" }

[profile.release]
opt-level = 2

# Web-Release: kleinere WASM-Binaries
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
